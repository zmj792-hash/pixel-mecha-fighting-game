<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>像素机甲对战</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0d0221;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'VT323', monospace;
            color: #eee;
            overflow: hidden;
        }
        #gameWrapper {
            position: relative;
            border: 3px solid #ff2a6d;
            box-shadow: 0 0 30px rgba(255, 42, 109, 0.4), 0 0 60px rgba(5, 217, 232, 0.2);
        }
        canvas {
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        #crtOverlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.12) 0px,
                rgba(0, 0, 0, 0.12) 2px,
                transparent 2px,
                transparent 6px
            );
            z-index: 5;
        }
        #crtOverlay::after {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.5) 100%);
        }
        #mobileWarning {
            display: none;
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: rgba(13, 2, 33, 0.95);
            color: #f9f871;
            text-align: center;
            padding: 15px;
            font-family: 'Press Start 2P', monospace;
            font-size: 12px;
            z-index: 100;
            border-top: 2px solid #f9f871;
        }
        @media (max-width: 768px), (hover: none) and (pointer: coarse) {
            #mobileWarning { display: block; }
        }
    </style>
</head>
<body>
    <div id="gameWrapper">
        <canvas id="gameCanvas" width="960" height="540"></canvas>
        <div id="crtOverlay"></div>
    </div>
    <div id="mobileWarning">⚠️ 建议使用桌面键盘游玩本游戏 ⚠️</div>
    <script src="game.js"></script>
</body>
</html>
